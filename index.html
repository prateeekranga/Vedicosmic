      name="description"

    <meta property="og:description" content="Free Vedic tools: today’s tithi and nakshatra, your birth star, planetary hours, numerology and a 17-minute daily sādhana. Calculated in your browser. No ads." />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="Free Vedic tools: today’s tithi and nakshatra, your birth star, planetary hours, numerology and a 17-minute daily sādhana. Calculated in your browser. No ads." />
    <meta name="twitter:image" content="https://vedicosmic.com/logo-full.png" />

    <!-- DNS prefetch for external origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Critical font preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Non-blocking font load: rel="preload" + onload swap trick.
      Split into two requests: critical display fonts first, secondary fonts deferred.
    -->
    <!-- 1) Critical: heading + body fonts (Cinzel + Inter) -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- 2) Secondary: Devanagari + Mono (defer via JS, optional for LCP) -->
    <script>
      ;(function(){
        var l=document.createElement('link');
        l.rel='stylesheet';
        l.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=optional';
        document.head.appendChild(l);
      })()
    </script>

    <title>VediCosmic: free Vedic tools and daily sādhana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
