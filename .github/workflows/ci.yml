name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily rebuild at 00:05 IST, so pre-rendered pages carry the new day's values.
    - cron: '35 18 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fail (instead of skipping) if share cards cannot start a browser.
      REQUIRE_PRERENDER: '1'
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit and golden tests
        run: npm test
      - name: Build (static pages, sitemaps, server rules, share cards, claims check)
        run: npm run build
      - name: Verify the pre-rendered pages
        run: npm run verify
      - name: Internal links
        run: npm run check:links

      - name: Serve the build (no SPA fallback, real 404s)
        run: |
          npx --yes serve@14.2.4 dist -l 4173 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat serve.log; exit 1
      - name: Smoke test
        run: npm run smoke -- http://localhost:4173
      - name: Accessibility (axe)
        run: npm run a11y -- http://localhost:4173 axe-report.json
      - name: Lighthouse CI (mobile; budgets warn until Phase 8)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            .lighthouseci/
            axe-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the build for publishing
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 3

  publish:
    # main → the 'deploy' branch Hostinger serves at vedicosmic.com; upgrade/** → 'staging'.
    name: Publish ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref == 'refs/heads/main' && 'deploy' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: bash scripts/publish-branch.sh ${{ github.ref == 'refs/heads/main' && 'deploy' || 'staging' }}

  hostinger-node18:
    # Until Hostinger is switched to the 'deploy' branch it still builds main itself on Node 18.
    name: Builds on Node 18 (Hostinger, until the switch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
